// ============ DYNASTY PICK VALUES (1QB standard) ============
// Adjusted upward for SF leagues at runtime
const PICK_VALUES = {
  1: [7200, 6400, 5800, 5300, 4900, 4500, 4200, 3950, 3700, 3500, 3300, 3100],
  2: [2900, 2700, 2500, 2350, 2200, 2050, 1900, 1750, 1600, 1450, 1300, 1150],
  3: [1050, 950, 870, 790, 720, 660, 600, 550, 500, 450, 410, 370],
  4: [340, 310, 280, 255, 230, 210, 190, 170, 155, 140, 125, 110],
  5: [100, 90, 80, 72, 64, 58, 52, 46, 42, 38, 34, 30]
};


// Penalty for future picks (uncertainty)
const FUTURE_DISCOUNT = { 0: 1.0, 1: 0.78, 2: 0.55, 3: 0.38 };


// ============ POSITION + AGE CURVES ============
const POSITION_PEAK = { QB: 30, RB: 25, WR: 27, TE: 28 };
const POSITION_DECAY = { QB: 0.04, RB: 0.11, WR: 0.06, TE: 0.07 };
const POSITION_BASE = { QB: 1.0, RB: 1.0, WR: 1.0, TE: 0.85, K: 0.05, DEF: 0.05 };


function ageMultiplier(pos, age) {
  if (!age || !POSITION_PEAK[pos]) return 1;
  const peak = POSITION_PEAK[pos];
  const decay = POSITION_DECAY[pos];
  if (age <= peak) return 1 + (peak - age) * 0.015; // slight youth boost
  return Math.max(0.15, Math.exp(-(age - peak) * decay));
}


function rankToValue(rank) {
  if (!rank || rank > 1500) return 0;
  // Exponential decay from search_rank Ã¢ÂÂ top players ~8000, fades fast
  return Math.round(8500 * Math.exp(-rank / 75));
}


function calcPlayerValue(player, isSuperflex) {
  if (!player) return 0;
  const pos = player.pos;
  if (!pos) return 0;
  if (pos === 'K' || pos === 'DEF') return Math.min(rankToValue(player.rank), 50);


  let value = rankToValue(player.rank);
  value *= ageMultiplier(pos, player.age);
  value *= POSITION_BASE[pos] || 0.5;


  // Superflex QB boost Ã¢ÂÂ QBs become elite
  if (isSuperflex && pos === 'QB') value *= 1.55;


  // Injury status penalty
  if (player.inj && ['IR', 'PUP', 'Out', 'Sus'].includes(player.inj)) value *= 0.7;


  return Math.round(value);
}


function calcPickValue(season, round, pick, currentSeason, isSuperflex) {
  const yearsOut = Math.max(0, parseInt(season) - parseInt(currentSeason));
  const discount = FUTURE_DISCOUNT[yearsOut] ?? 0.3;
  const sfMult = isSuperflex && round === 1 ? 1.25 : isSuperflex && round === 2 ? 1.15 : 1;


  if (!PICK_VALUES[round]) return Math.round(50 * discount);
  const slot = pick && pick >= 1 && pick <= 12 ? pick - 1 : 5; // mid-round default
  const base = PICK_VALUES[round][Math.min(slot, 11)];
  return Math.round(base * discount * sfMult);
}


// ============ API ============
async function api(path) {
  const r = await fetch(`${API}${path}`);
  if (!r.ok) throw new Error(`API ${path}: ${r.status}`);
  return r.json();
}


async function loadPlayers() {
  try {
    const cachedRaw = localStorage.getItem(CACHE_KEY);
    const cached = cachedRaw ? { value: cachedRaw } : null;
    if (cached) {
      const parsed = JSON.parse(cached.value);
      if (Date.now() - parsed.timestamp < CACHE_TTL) return parsed.data;
    }
  } catch (e) { /* fall through */ }


  const all = await api('/players/nfl');
  const slim = {};
  for (const [id, p] of Object.entries(all)) {
    if (!p.first_name && !p.last_name) continue;
    const pos = p.position || (p.fantasy_positions && p.fantasy_positions[0]);
    if (!pos || ['LB','DB','DL','CB','S','DE','DT'].includes(pos)) continue;
    slim[id] = {
      n: `${p.first_name || ''} ${p.last_name || ''}`.trim(),
      pos: pos,
      team: p.team || 'FA',
      age: p.age || null,
      rank: p.search_rank || 9999,
      inj: p.injury_status || null,
      exp: p.years_exp || 0,
      status: p.status || null
    };
  }


  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), data: slim }));
  } catch (e) { /* size cap, fine */ }


  return slim;
}


// ============ STATS HELPERS ============
function buildStandings(rosters, users, allWeeksMatchups) {
  const userMap = Object.fromEntries(users.map(u => [u.user_id, u]));
  return rosters.map(r => {
    const user = userMap[r.owner_id] || {};
    const teamName = user.metadata?.team_name || user.display_name || `Team ${r.roster_id}`;
    const settings = r.settings || {};
    const pf = (settings.fpts || 0) + (settings.fpts_decimal || 0) / 100;
    const pa = (settings.fpts_against || 0) + (settings.fpts_against_decimal || 0) / 100;
    return {
      roster_id: r.roster_id,
      owner_id: r.owner_id,
      team: teamName,
      owner: user.display_name || 'Unknown',
      avatar: user.avatar,
      wins: settings.wins || 0,
      losses: settings.losses || 0,
      ties: settings.ties || 0,
      pf,
      pa,
      players: r.players || [],
      starters: r.starters || [],
      taxi: r.taxi || [],
      reserve: r.reserve || []
    };
  });
}


function calcRosterValue(roster, playerDb, isSuperflex) {
  const players = (roster.players || []).map(pid => ({ id: pid, ...playerDb[pid] }));
  const valued = players.map(p => ({ ...p, value: calcPlayerValue(p, isSuperflex) }));
  const total = valued.reduce((s, p) => s + p.value, 0);
  return { players: valued, total };
}


function gradePosition(rosterPlayers, pos, isSuperflex) {
  const players = rosterPlayers
    .filter(p => p.pos === pos)
    .sort((a, b) => calcPlayerValue(b, isSuperflex) - calcPlayerValue(a, isSuperflex));


  const topValues = players.slice(0, pos === 'QB' ? 2 : 4).map(p => calcPlayerValue(p, isSuperflex));
  const score = topValues.reduce((s, v, i) => s + v * (1 / (i + 1)), 0);


  // Position-specific thresholds (calibrated for 12-team)
  const thresholds = {
    QB: isSuperflex ? [8500, 6500, 4800, 3200, 1800] : [4500, 3200, 2200, 1300, 600],
    RB: [9500, 7500, 5500, 3800, 2200],
    WR: [12000, 9500, 7500, 5500, 3500],
    TE: [4000, 2800, 1800, 1100, 500]
  };
  const t = thresholds[pos] || [10000, 7000, 4000, 2000, 1000];
  const grade = score >= t[0] ? 'A+' : score >= t[1] ? 'A' : score >= t[2] ? 'B' : score >= t[3] ? 'C' : score >= t[4] ? 'D' : 'F';
  return { grade, score: Math.round(score), count: players.length, players: players.slice(0, 5) };
}


function avgAge(players) {
  const ages = players.filter(p => p.age && ['QB','RB','WR','TE'].includes(p.pos)).map(p => p.age);
  if (!ages.length) return null;
  return (ages.reduce((s,a) => s+a, 0) / ages.length).toFixed(1);
}


function computePowerRankings(standings, rosterValues, isSuperflex) {
  // Hybrid: 35% record, 35% PF, 30% roster talent
  const teams = standings.map(s => {
    const games = s.wins + s.losses + s.ties;
    const winPct = games ? (s.wins + s.ties * 0.5) / games : 0.5;
    const rv = rosterValues[s.roster_id];
    return { ...s, winPct, totalValue: rv.total };
  });


  const maxPF = Math.max(...teams.map(t => t.pf), 1);
  const maxVal = Math.max(...teams.map(t => t.totalValue), 1);


  const ranked = teams.map(t => {
    const recordScore = t.winPct * 100;
    const pfScore = (t.pf / maxPF) * 100;
    const valScore = (t.totalValue / maxVal) * 100;
    const rating = recordScore * 0.35 + pfScore * 0.35 + valScore * 0.30;
    return { ...t, rating: Math.round(rating * 10) / 10, recordScore, pfScore, valScore };
  });


  return ranked.sort((a, b) => b.rating - a.rating);
}


// Strength of schedule from past matchups (avg opponent PF/g)
function calcSOS(rosterId, allMatchups, standings, currentWeek, totalWeeks) {
  // Schedule remaining ~ unknown; use opponent quality faced as proxy + remaining estimated by H2H
  const standMap = Object.fromEntries(standings.map(s => [s.roster_id, s]));
  const oppPFs = [];
  Object.entries(allMatchups).forEach(([week, matchups]) => {
    const w = parseInt(week);
    if (!matchups) return;
    const teamM = matchups.find(m => m.roster_id === rosterId);
    if (!teamM) return;
    const oppM = matchups.find(m => m.matchup_id === teamM.matchup_id && m.roster_id !== rosterId);
    if (oppM) {
      const opp = standMap[oppM.roster_id];
      if (opp) {
        const games = opp.wins + opp.losses + opp.ties;
        oppPFs.push(games ? opp.pf / games : 0);
      }
    }
  });
  if (!oppPFs.length) return null;
  return oppPFs.reduce((s,v) => s+v, 0) / oppPFs.length;
}


// Monte Carlo playoff odds
function simulatePlayoffs(standings, currentWeek, regSeasonWeeks, playoffSpots, iterations = 3000) {
  const teams = standings.map(s => {
    const games = s.wins + s.losses + s.ties;
    const avgPF = games ? s.pf / games : 100;
    const stdDev = avgPF * 0.22; // ~22% weekly variance
    return { ...s, avgPF, stdDev, mockWins: 0, mockLosses: 0 };
  });


  const playoffCounts = Object.fromEntries(teams.map(t => [t.roster_id, 0]));
  const champCounts = Object.fromEntries(teams.map(t => [t.roster_id, 0]));
  const weeksLeft = Math.max(0, regSeasonWeeks - currentWeek);


  for (let iter = 0; iter < iterations; iter++) {
    const sim = teams.map(t => ({ ...t, simWins: t.wins, simLosses: t.losses }));


    for (let w = 0; w < weeksLeft; w++) {
      // Pair teams randomly
      const shuffled = [...sim].sort(() => Math.random() - 0.5);
      for (let i = 0; i < shuffled.length; i += 2) {
        const a = shuffled[i], b = shuffled[i+1];
        if (!b) continue;
        const aScore = a.avgPF + (Math.random() - 0.5) * a.stdDev * 2;
        const bScore = b.avgPF + (Math.random() - 0.5) * b.stdDev * 2;
        if (aScore > bScore) { a.simWins++; b.simLosses++; }
        else { b.simWins++; a.simLosses++; }
      }
    }


    sim.sort((a,b) => b.simWins - a.simWins || b.pf - a.pf);
    sim.slice(0, playoffSpots).forEach(t => playoffCounts[t.roster_id]++);


    // Quick champion sim Ã¢ÂÂ top seeds favored, with upside variance
    const bracket = sim.slice(0, playoffSpots);
    let alive = [...bracket];
    while (alive.length > 1) {
      const next = [];
      for (let i = 0; i < alive.length; i += 2) {
        const a = alive[i], b = alive[i+1];
        if (!b) { next.push(a); continue; }
        const aS = a.avgPF + (Math.random() - 0.5) * a.stdDev * 2;
        const bS = b.avgPF + (Math.random() - 0.5) * b.stdDev * 2;
        next.push(aS > bS ? a : b);
      }
      alive = next;
    }
    if (alive[0]) champCounts[alive[0].roster_id]++;
  }


  return Object.fromEntries(
    teams.map(t => [t.roster_id, {
      playoff: (playoffCounts[t.roster_id] / iterations) * 100,
      champ: (champCounts[t.roster_id] / iterations) * 100
    }])
  );
}

  const [error, setError] = useState(null);
  const [refreshKey, setRefreshKey] = useState(0);


  const load = useCallback(async () => {
    try {
      setLoading(true); setError(null);


      const [league, users, rosters, tradedPicks, nflState] = await Promise.all([
        api(`/league/${LEAGUE_ID}`),
        api(`/league/${LEAGUE_ID}/users`),
        api(`/league/${LEAGUE_ID}/rosters`),
        api(`/league/${LEAGUE_ID}/traded_picks`),
        api('/state/nfl')
      ]);


      const currentWeek = nflState.week || 1;
      const regSeasonWeeks = (league.settings?.playoff_week_start || 15) - 1;
      const playoffSpots = league.settings?.playoff_teams || 6;
      const rosterPositions = league.roster_positions || [];
      const isSuperflex = rosterPositions.includes('SUPER_FLEX') ||
                         rosterPositions.filter(p => p === 'QB').length >= 2;


      // Fetch all matchups up to current week
      const weeksToFetch = Math.min(currentWeek, regSeasonWeeks);
      const matchupPromises = [];
      for (let w = 1; w <= weeksToFetch; w++) {
        matchupPromises.push(api(`/league/${LEAGUE_ID}/matchups/${w}`).catch(() => null));
      }
      const matchupsArr = await Promise.all(matchupPromises);
      const allMatchups = {};
      matchupsArr.forEach((m, i) => { if (m && m.length) allMatchups[i+1] = m; });


      // Current week matchups (next unplayed)
      let displayWeek = currentWeek;
      if (currentWeek > regSeasonWeeks) displayWeek = regSeasonWeeks;
      const currentMatchups = allMatchups[displayWeek] ||
        await api(`/league/${LEAGUE_ID}/matchups/${displayWeek}`).catch(() => []);


      const players = await loadPlayers();


      setData({
        league, users, rosters, tradedPicks, players,
        allMatchups, currentMatchups,
        currentWeek, regSeasonWeeks, playoffSpots,
        isSuperflex, currentSeason: nflState.season, displayWeek
      });
    } catch (e) {
      console.error(e);
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }, []);


  useEffect(() => { load(); }, [load, refreshKey]);


  // Derived data
  const derived = useMemo(() => {
    if (!data) return null;
    const standings = buildStandings(data.rosters, data.users, data.allMatchups);
    const rosterValues = Object.fromEntries(
      standings.map(s => [s.roster_id, calcRosterValue(s, data.players, data.isSuperflex)])
    );
    const powerRankings = computePowerRankings(standings, rosterValues, data.isSuperflex);
    const playoffOdds = simulatePlayoffs(standings, data.currentWeek, data.regSeasonWeeks, data.playoffSpots);


    // SOS per team
    const sos = {};
    standings.forEach(s => {
      sos[s.roster_id] = calcSOS(s.roster_id, data.allMatchups, standings, data.currentWeek, data.regSeasonWeeks);
    });


    // Draft capital per team
    const draftCapital = {};
    standings.forEach(s => { draftCapital[s.roster_id] = { picks: [], total: 0 }; });


    // Owned picks: each team starts owning their own picks for next ~3 years
    const yearsAhead = [0, 1, 2];
    const seasons = yearsAhead.map(y => String(parseInt(data.currentSeason) + y));
    const rounds = [1, 2, 3, 4];


    // Build pick ownership map. Traded picks override defaults.
    const pickMap = {}; // key: season-round-original_roster_id -> owner_roster_id
    standings.forEach(s => {
      seasons.forEach(season => {
        rounds.forEach(round => {
          pickMap[`${season}-${round}-${s.roster_id}`] = s.roster_id;
        });
      });
    });
    data.tradedPicks.forEach(tp => {
      const key = `${tp.season}-${tp.round}-${tp.roster_id}`;
      if (pickMap[key] !== undefined) pickMap[key] = tp.owner_id;
    });


    Object.entries(pickMap).forEach(([key, ownerId]) => {
      const [season, round, origId] = key.split('-').map((v,i) => i===0 ? v : parseInt(v));
      // Estimate pick slot from original owner's projected strength
      const orig = powerRankings.find(p => p.roster_id === parseInt(origId));
      const slot = orig ? powerRankings.indexOf(orig) + 1 : 6;
      // Worse teams pick higher (slot 1 = best pick for round 1)
      const pickSlot = 13 - slot;
      const value = calcPickValue(season, parseInt(round), pickSlot, data.currentSeason, data.isSuperflex);
      if (draftCapital[ownerId]) {
        draftCapital[ownerId].picks.push({ season, round: parseInt(round), origRosterId: parseInt(origId), value, isOwn: parseInt(origId) === ownerId, estimatedSlot: pickSlot });
        draftCapital[ownerId].total += value;
      }
    });


    return { standings, rosterValues, powerRankings, playoffOdds, sos, draftCapital };
  }, [data]);


  if (loading) return <LoadingScreen />;
  if (error) return <ErrorScreen error={error} onRetry={() => setRefreshKey(k=>k+1)} />;
  if (!data || !derived) return <LoadingScreen />;


  return (
    <div style={{ minHeight: '100vh', background: '#0a0d12', color: '#e8ecf0', fontFamily: 'DM Sans, sans-serif' }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
        * { box-sizing: border-box; }
        body { margin: 0; }
        .display { font-family: 'Anton', sans-serif; letter-spacing: 0.02em; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .tab-btn { transition: all 0.2s; }
        .tab-btn:hover { color: #d4a857; }
        .card { background: #131820; border: 1px solid #2a3441; border-radius: 4px; }
        .card-hover:hover { border-color: #d4a857; }
        .row-hover:hover { background: #1c2530; }
        button { font-family: inherit; cursor: pointer; }
        @keyframes pulse-dot {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.4; }
        }
        .live-dot { animation: pulse-dot 2s infinite; }
        @keyframes fade-in {
          from { opacity: 0; transform: translateY(8px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fade-in 0.3s ease-out; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #131820; }
        ::-webkit-scrollbar-thumb { background: #2a3441; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a4451; }
      `}</style>


      <Header data={data} onRefresh={() => setRefreshKey(k=>k+1)} />
      <Nav tab={tab} setTab={setTab} />


      <div className="fade-in" key={tab} style={{ maxWidth: 1400, margin: '0 auto', padding: '24px 20px 60px' }}>
        {tab === 'overview' && <Overview data={data} derived={derived} />}
        {tab === 'power' && <PowerRankings data={data} derived={derived} />}
        {tab === 'teams' && <Teams data={data} derived={derived} />}

}

function TradeAnalyzer({ data, derived }) {
  const [teamA, setTeamA] = useState(derived.standings[0].roster_id);
  const [teamB, setTeamB] = useState(derived.standings[1].roster_id);
  const [sideA, setSideA] = useState([]);
  const [sideB, setSideB] = useState([]);
  const [search, setSearch] = useState({ a: '', b: '' });
  const [pickerOpen, setPickerOpen] = useState(null);


  const rosterA = derived.standings.find(s => s.roster_id === teamA);
  const rosterB = derived.standings.find(s => s.roster_id === teamB);
  const playersA = derived.rosterValues[teamA].players;
  const playersB = derived.rosterValues[teamB].players;
  const picksA = derived.draftCapital[teamA]?.picks || [];
  const picksB = derived.draftCapital[teamB]?.picks || [];


  const valueA = sideA.reduce((s, item) => s + item.value, 0);
  const valueB = sideB.reduce((s, item) => s + item.value, 0);
  const diff = Math.abs(valueA - valueB);
  const total = valueA + valueB;
  const fairness = total === 0 ? 100 : Math.max(0, 100 - (diff / total) * 100);


  const verdict = fairness >= 90 ? { label: 'EVEN TRADE', color: '#10b981' } :
                  fairness >= 75 ? { label: 'FAIR', color: '#fbbf24' } :
                  fairness >= 60 ? { label: 'LOPSIDED', color: '#f59e0b' } :
                                   { label: 'VETO', color: '#f87171' };


  const winner = valueA > valueB ? rosterB?.team : rosterA?.team;


  function addItem(side, item) {
    if (side === 'a') setSideA([...sideA, item]);
    else setSideB([...sideB, item]);
    setPickerOpen(null);
  }
  function removeItem(side, idx) {
    if (side === 'a') setSideA(sideA.filter((_,i) => i !== idx));
    else setSideB(sideB.filter((_,i) => i !== idx));
  }


  return (
    <div>
      <SectionTitle sub="Add players or picks to each side. Fairness based on dynasty values.">Trade Analyzer</SectionTitle>


      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 16 }}>
        {[
          { side: 'a', team: teamA, setTeam: setTeamA, items: sideA, value: valueA, players: playersA, picks: picksA, roster: rosterA },
          { side: 'b', team: teamB, setTeam: setTeamB, items: sideB, value: valueB, players: playersB, picks: picksB, roster: rosterB }
        ].map(s => (
          <div key={s.side} className="card" style={{ padding: 16, minWidth: 0 }}>
            <select value={s.team} onChange={e => { s.setTeam(parseInt(e.target.value)); s.side === 'a' ? setSideA([]) : setSideB([]); }}
              style={{
                width: '100%', background: '#1c2530', color: '#e8ecf0', border: '1px solid #2a3441',
                padding: 10, borderRadius: 4, fontSize: 14, fontWeight: 600, marginBottom: 12, fontFamily: 'inherit'
              }}>
              {derived.standings.map(t => <option key={t.roster_id} value={t.roster_id}>{t.team}</option>)}
            </select>


            <div style={{ minHeight: 120, padding: 8, background: '#0a0d12', border: '1px dashed #2a3441', borderRadius: 4, marginBottom: 10 }}>
              {s.items.length === 0 ?
                <div style={{ color: '#475569', fontSize: 12, textAlign: 'center', padding: '30px 0' }}>Add assets below</div> :
                s.items.map((item, i) => (
                  <div key={i} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '6px 8px', background: '#1c2530', borderRadius: 3, marginBottom: 4 }}>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ fontSize: 13, fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{item.label}</div>
                      <div className="mono" style={{ fontSize: 10, color: '#d4a857' }}>{item.value.toLocaleString()}</div>
                    </div>
                    <button onClick={() => removeItem(s.side, i)} style={{ background: 'transparent', border: 'none', color: '#8b95a3', padding: 4 }}>
                      <X size={14} />
                    </button>
                  </div>
                ))
              }
            </div>


            <button onClick={() => setPickerOpen(s.side)} style={{
              width: '100%', padding: 10, background: '#1c2530', border: '1px solid #2a3441',
              color: '#d4a857', borderRadius: 4, fontSize: 12, fontWeight: 600, letterSpacing: 0.5,
              display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6
            }}>
              <Plus size={14} /> ADD ASSET
            </button>


            <div className="mono" style={{ textAlign: 'right', marginTop: 12, fontSize: 11, color: '#8b95a3' }}>
              TOTAL: <span style={{ fontSize: 16, color: '#d4a857' }}>{s.value.toLocaleString()}</span>
            </div>
          </div>
        ))}
      </div>


      <div className="card" style={{ padding: 20, textAlign: 'center' }}>
        <div className="mono" style={{ fontSize: 10, color: '#8b95a3', letterSpacing: 1, marginBottom: 8 }}>FAIRNESS</div>
        <div className="display" style={{ fontSize: 56, color: verdict.color, lineHeight: 1 }}>
          {Math.round(fairness)}<span style={{ fontSize: 24 }}>%</span>
        </div>
        <div className="mono" style={{ fontSize: 13, color: verdict.color, letterSpacing: 1.5, marginTop: 8, fontWeight: 600 }}>{verdict.label}</div>
        {diff > 0 && total > 0 && (
          <div style={{ fontSize: 12, color: '#8b95a3', marginTop: 10 }}>
            {winner} wins by <span className="mono" style={{ color: '#e8ecf0' }}>{diff.toLocaleString()}</span> value
          </div>
        )}
      </div>


      {pickerOpen && (

          side={pickerOpen}

          onSelect={(item) => addItem(pickerOpen, item)}
          onClose={() => setPickerOpen(null)}
        />
      )}
    </div>
  );
}

  const maxSOS = Math.max(...Object.values(sos).filter(v => v != null));
  const minSOS = Math.min(...Object.values(sos).filter(v => v != null));


  return (
    <div>
      <SectionTitle sub={`Monte Carlo simulation (3,000 iterations) ÃÂ· ${data.playoffSpots} teams make playoffs ÃÂ· Week ${data.currentWeek}`}>Playoff Odds</SectionTitle>

            </tr>
          </thead>
          <tbody>
            {sorted.map((t, i) => {
              const odds = playoffOdds[t.roster_id];
              const tSOS = sos[t.roster_id];
              const sosLabel = tSOS == null ? 'Ã¢ÂÂ' : tSOS.toFixed(1);
              const sosNorm = tSOS == null ? 50 : ((tSOS - minSOS) / (maxSOS - minSOS)) * 100;
              return (
                <tr key={t.roster_id} className="row-hover" style={{ borderTop: '1px solid #2a3441' }}>
                  <td style={cell}><span className="mono" style={{ color: '#8b95a3', fontSize: 13 }}>{i+1}</span></td>

                  <td style={{...cell, textAlign:'right'}}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, justifyContent: 'flex-end' }}>
                      <div style={{ width: 80, height: 4, background: '#2a3441', borderRadius: 2, overflow: 'hidden' }}>
                        <div style={{ width: `${odds.playoff}%`, height: '100%', background: odds.playoff > 50 ? '#10b981' : '#f59e0b' }} />
                      </div>
                      <span className="mono" style={{ minWidth: 50, textAlign: 'right' }}>{odds.playoff.toFixed(1)}%</span>
                    </div>
                  </td>
                  <td className="mono" style={{...cell, textAlign:'right', color: odds.champ > 15 ? '#d4a857' : '#8b95a3'}}>
                    {odds.champ.toFixed(1)}%
                  </td>
                  <td style={{...cell, textAlign:'right'}}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 6, justifyContent: 'flex-end' }}>
                      <span className="mono" style={{ fontSize: 12, color: sosNorm > 60 ? '#f87171' : sosNorm < 40 ? '#4ade80' : '#fbbf24' }}>
                        {sosLabel}
                      </span>
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>


      <div className="card" style={{ padding: 16 }}>
        <div className="mono" style={{ fontSize: 10, color: '#8b95a3', letterSpacing: 1, marginBottom: 8 }}>METHODOLOGY</div>
        <div style={{ fontSize: 13, color: '#e8ecf0', lineHeight: 1.6 }}>
          Each team's projected PF/game is modeled as a normal distribution with ~22% variance.
          The remaining schedule is simulated 3,000 times with random pairings (approximation Ã¢ÂÂ Sleeper doesn't expose future H2H matchups).
          Strength of Schedule (SOS) shows opponents' average PF/game faced so far Ã¢ÂÂ higher = tougher schedule.
        </div>
      </div>
    </div>
  );
}

      if (p.team === 'FA' && (!p.exp || p.exp > 3) && (!p.rank || p.rank > 800)) continue;

              padding: '10px 14px', background: pos === p ? '#d4a857' : '#131820',
              border: '1px solid', borderColor: pos === p ? '#d4a857' : '#2a3441',

            <tr style={{ background: '#1c2530' }}>

function MatchupGrid({ data, derived, matchups }) {
  const ms = matchups || data.currentMatchups || [];
  const standMap = Object.fromEntries(derived.standings.map(s => [s.roster_id, s]));
  const grouped = {};
  ms.forEach(m => {
    if (!grouped[m.matchup_id]) grouped[m.matchup_id] = [];
    grouped[m.matchup_id].push(m);
  });


  const pairs = Object.values(grouped).filter(g => g.length === 2);


  if (pairs.length === 0) return <div className="card" style={{ padding: 30, textAlign: 'center', color: '#8b95a3' }}>No matchup data for this week</div>;


  return (
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(320px, 1fr))', gap: 12 }}>
      {pairs.map(([a, b]) => {
        const teamA = standMap[a.roster_id];
        const teamB = standMap[b.roster_id];
        if (!teamA || !teamB) return null;
        const aWin = a.points > b.points;
        const bWin = b.points > a.points;
        const played = (a.points + b.points) > 0;
        return (
          <div key={a.matchup_id} className="card" style={{ padding: 14 }}>
            <MatchupRow team={teamA} points={a.points} winner={aWin} played={played} />
            <div style={{ height: 1, background: '#2a3441', margin: '10px 0' }} />
            <MatchupRow team={teamB} points={b.points} winner={bWin} played={played} />
            {!played && (
              <div className="mono" style={{ marginTop: 10, fontSize: 10, color: '#8b95a3', textAlign: 'center', letterSpacing: 1 }}>UPCOMING</div>
            )}
          </div>
        );
      })}
    </div>
  );
}


function MatchupRow({ team, points, winner, played }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, minWidth: 0, flex: 1 }}>
        <Avatar id={team.avatar} size={32} />
        <div style={{ minWidth: 0 }}>
          <div style={{ fontSize: 13, fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{team.team}</div>

// ============ GALAXY (3D SIMILARITY MATRIX Ã¢ÂÂ FULL ROSTER + FA) ============
const POS_HEX = { QB: 0xef4444, RB: 0x10b981, WR: 0x3b82f6, TE: 0xf97316, K: 0x8b5cf6, DEF: 0x64748b };
const POS_COLOR_CSS = { QB: '#ef4444', RB: '#10b981', WR: '#3b82f6', TE: '#f97316', K: '#8b5cf6', DEF: '#64748b' };

function _dot(a, b) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]*b[i]; return s; }
function _norm(v) { var l = Math.sqrt(_dot(v,v)); return l > 1e-9 ? v.map(function(x){return x/l;}) : v.map(function(){return 0;}); }
function _matVec(M, v) { return M.map(function(r){return _dot(r,v);}); }

function pca3d(data) {
  var n = data.length;
  if (n === 0) return [];
  var d = data[0].length;
  var mean = new Array(d).fill(0);
  for (var i = 0; i < n; i++) for (var j = 0; j < d; j++) mean[j] += data[i][j]/n;
  var X = data.map(function(v){ return v.map(function(x,i){return x - mean[i];}); });
  var C = Array.from({length:d}, function(){ return new Array(d).fill(0); });
  for (var i = 0; i < n; i++) for (var j = 0; j < d; j++) for (var k = 0; k < d; k++) C[j][k] += X[i][j]*X[i][k]/(n-1||1);
  var Cd = C.map(function(r){return [...r];});
  var comps = [];
  for (var ci = 0; ci < 3; ci++) {
    var v = _norm(new Array(d).fill(0).map(function(_,i){return Math.sin(ci*7+i*13)+Math.cos(ci*3+i*5);}));
    for (var it = 0; it < 120; it++) {
      var nv = _norm(_matVec(Cd, v));
      if (Math.abs(_dot(nv,v)) > 0.99999) { v = nv; break; }
      v = nv;
    }
    comps.push(v);
    var lam = _dot(v, _matVec(Cd, v));
    for (var j = 0; j < d; j++) for (var k = 0; k < d; k++) Cd[j][k] -= lam*v[j]*v[k];
  }
  return X.map(function(v){ return comps.map(function(c){return _dot(v,c);}); });
}

function buildFeatures(player, isSuperflex) {
  var pos = player.pos || 'WR';
  var PW = 5;
  var qb = (pos==='QB'?1:0)*PW, rb = (pos==='RB'?1:0)*PW, wr = (pos==='WR'?1:0)*PW, te = (pos==='TE'?1:0)*PW;
  var age = Math.max(0, Math.min(1, ((player.age||26)-21)/16));
  var exp = Math.max(0, Math.min(1, (player.exp||0)/15));
  var val = Math.log10((player.value||100)+1)/4.5;
  var rank = Math.max(0, Math.min(1, 1 - Math.log10((player.rank||9999)+1)/4));
  var healthy = player.inj ? 0 : 1;
  var sfBoost = (isSuperflex && pos==='QB') ? 0.5 : 0;
  return [qb, rb, wr, te, age, exp, val, rank, healthy, sfBoost];
}

function Galaxy({ data, derived }) {
  var mountRef = useRef(null);
  var labelCanvasRef = useRef(null);
  var sceneRef = useRef(null);
  var [selected, setSelected] = useState(null);
  var [hovered, setHovered] = useState(null);
  var [query, setQuery] = useState('');
  var [posFilter, setPosFilter] = useState('ALL');
  var [showLabels, setShowLabels] = useState(false);
  var [faCount, setFaCount] = useState(150);

  var universe = useMemo(function() {
    var players = [];
    var seen = new Set();
    derived.standings.forEach(function(s) {
      var rv = derived.rosterValues[s.roster_id];
      rv.players.forEach(function(p) {
        if (seen.has(p.id) || !p.pos || !['QB','RB','WR','TE'].includes(p.pos)) return;
        seen.add(p.id);
        players.push(Object.assign({}, p, { owner: s.team, ownerAvatar: s.avatar, isFA: false, rosterId: s.roster_id }));
      });
    });
    // All rostered + top FA players
    var topFAs = Object.entries(data.players)
      .filter(function(e){ var id=e[0],p=e[1]; return !seen.has(id) && ['QB','RB','WR','TE'].includes(p.pos); })
      .map(function(e){ var id=e[0],p=e[1]; return Object.assign({id:id},p,{value:calcPlayerValue(p,data.isSuperflex),owner:'Free Agent',isFA:true}); })
      .filter(function(p){ return p.value >= 50; })
      .sort(function(a,b){ return b.value-a.value; })
      .slice(0, faCount);
    return players.concat(topFAs);
  }, [data, derived, faCount]);

  var positions3d = useMemo(function() {
    if (!universe.length) return [];
    var features = universe.map(function(p){ return buildFeatures(p, data.isSuperflex); });
    var coords = pca3d(features);
    var mins = [Infinity,Infinity,Infinity], maxs = [-Infinity,-Infinity,-Infinity];
    coords.forEach(function(c){ c.forEach(function(v,i){ if(v<mins[i])mins[i]=v; if(v>maxs[i])maxs[i]=v; }); });
    var ranges = maxs.map(function(m,i){ return Math.max(1e-6, m-mins[i]); });
    var SCALE = 42;
    return coords.map(function(c){ return c.map(function(v,i){ return ((v-mins[i])/ranges[i]-0.5)*2*SCALE; }); });
  }, [universe, data.isSuperflex]);

  useEffect(function() {
    if (!mountRef.current || !window.THREE || !universe.length) return;
    var mount = mountRef.current;
    var w = mount.clientWidth, h = mount.clientHeight;

    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030508);
    scene.fog = new THREE.FogExp2(0x030508, 0.006);

    var camera = new THREE.PerspectiveCamera(50, w/h, 0.1, 600);
    var camState = { dist: 95, rotX: 0.25, rotY: 0.4, targetX: 0.25, targetY: 0.4, autoRot: 0 };

    var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(w, h);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    mount.appendChild(renderer.domElement);

    // Background starfield
    var starsGeo = new THREE.BufferGeometry();
    var starPos = new Float32Array(3000);
    for (var i = 0; i < 1000; i++) {
      var r = 150 + Math.random()*100, th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
      starPos[i*3] = r*Math.sin(ph)*Math.cos(th);
      starPos[i*3+1] = r*Math.sin(ph)*Math.sin(th);
      starPos[i*3+2] = r*Math.cos(ph);
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    var starSizes = new Float32Array(1000).fill(0).map(function(){ return 0.3 + Math.random()*0.8; });
    starsGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
    var starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.4, sizeAttenuation: true });
    scene.add(new THREE.Points(starsGeo, starMat));

    // Nebula-like ambient glow clouds for position clusters
    var POS_LIST = ['QB','RB','WR','TE'];
    var clusterCenters = {};
    POS_LIST.forEach(function(pos) {
      var posPlayers = universe.map(function(p,i){ return {p:p,i:i}; }).filter(function(x){ return x.p.pos===pos; });
      if (!posPlayers.length) return;
      var cx=0,cy=0,cz=0;
      posPlayers.forEach(function(x){ cx+=positions3d[x.i][0]; cy+=positions3d[x.i][1]; cz+=positions3d[x.i][2]; });
      cx/=posPlayers.length; cy/=posPlayers.length; cz/=posPlayers.length;
      clusterCenters[pos] = [cx,cy,cz];
      // Soft glow sphere for cluster
      var glowGeo = new THREE.SphereGeometry(12, 16, 16);
      var col = POS_HEX[pos] || 0x888888;
      var glowMat = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.04, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.BackSide });
      var glowMesh = new THREE.Mesh(glowGeo, glowMat);
      glowMesh.position.set(cx, cy, cz);
      scene.add(glowMesh);
    });

    // Player meshes with value-based sizing and glow halos
    var playerMeshes = [];
    var playerGroup = new THREE.Group();
    var glowGroup = new THREE.Group();

    universe.forEach(function(p, i) {
      var xyz = positions3d[i];
      if (!xyz) return;
      var x = xyz[0], y = xyz[1], z = xyz[2];
      var col = POS_HEX[p.pos] || 0x888888;
      var logVal = Math.log10((p.value||100)+1);
      var radius = 0.35 + logVal * 0.28;
      if (p.isFA) radius *= 0.75;

      var geo = new THREE.SphereGeometry(radius, 10, 10);
      var mat = new THREE.MeshBasicMaterial({ color: col });
      var mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.userData = { player: p, idx: i, radius: radius };
      playerGroup.add(mesh);
      playerMeshes.push(mesh);

      // Glow halo Ã¢ÂÂ larger for high-value players
      var glowRadius = radius * (p.isFA ? 2 : 3.5) * (1 + logVal*0.15);
      var glowGeo = new THREE.SphereGeometry(glowRadius, 8, 8);
      var opacity = p.isFA ? 0.08 : 0.18 + logVal*0.04;
      var glowMat = new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: Math.min(opacity, 0.35), blending: THREE.AdditiveBlending, depthWrite: false });
      var glowMesh = new THREE.Mesh(glowGeo, glowMat);
      glowMesh.position.set(x, y, z);
      glowGroup.add(glowMesh);
    });

    scene.add(glowGroup);
    scene.add(playerGroup);
    sceneRef.current = { scene, camera, renderer, playerMeshes, playerGroup, glowGroup, camState, clusterCenters };

    // Selection ring
    var ringGeo = new THREE.RingGeometry(1, 1.2, 32);
    var ringMat = new THREE.MeshBasicMaterial({ color: 0xd4a857, side: THREE.DoubleSide, transparent: true, opacity: 0.95 });
    var selRing = new THREE.Mesh(ringGeo, ringMat);
    selRing.visible = false;
    scene.add(selRing);

    // Hover ring (white)
    var hoverRingGeo = new THREE.RingGeometry(1, 1.15, 28);
    var hoverRingMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
    var hoverRing = new THREE.Mesh(hoverRingGeo, hoverRingMat);
    hoverRing.visible = false;
    scene.add(hoverRing);

    // Raycaster
    var raycaster = new THREE.Raycaster();
    raycaster.params.Mesh = {};
    var ndc = new THREE.Vector2();

    // Pointer state
    var pState = { dragging: false, x: 0, y: 0, downX: 0, downY: 0, moved: false, pinchDist: 0 };
    function getXY(e) {
      if (e.touches && e.touches.length) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
      return { x: e.clientX, y: e.clientY };
    }
    function getPinchDist(e) {
      if (!e.touches || e.touches.length < 2) return 0;
      var dx = e.touches[0].clientX-e.touches[1].clientX, dy = e.touches[0].clientY-e.touches[1].clientY;
      return Math.sqrt(dx*dx+dy*dy);
    }
    function doRaycast(x, y) {
      var rect = renderer.domElement.getBoundingClientRect();
      ndc.x = ((x-rect.left)/rect.width)*2-1;
      ndc.y = -((y-rect.top)/rect.height)*2+1;
      raycaster.setFromCamera(ndc, camera);
      return raycaster.intersectObjects(playerMeshes);
    }
    function onDown(e) {
      var xy = getXY(e);
      pState.dragging=true; pState.moved=false;
      pState.x=xy.x; pState.y=xy.y; pState.downX=xy.x; pState.downY=xy.y;
      if (e.touches && e.touches.length===2) pState.pinchDist = getPinchDist(e);
    }
    function onMove(e) {
      if (!pState.dragging) {
        var xy = getXY(e);
        var hits = doRaycast(xy.x, xy.y);
        if (hits.length) {
          renderer.domElement.style.cursor = 'pointer';
          var obj = hits[0].object;
          setHovered({ player: obj.userData.player, screenX: xy.x, screenY: xy.y });
          hoverRing.position.copy(obj.position);
          hoverRing.scale.setScalar(obj.userData.radius * 2.8);
          hoverRing.visible = true;
        } else {
          renderer.domElement.style.cursor = 'grab';
          setHovered(null);
          hoverRing.visible = false;
        }
        return;
      }
      if (e.touches && e.touches.length===2) {
        var nd = getPinchDist(e);
        if (pState.pinchDist>0) camState.dist = Math.max(20, Math.min(250, camState.dist+(pState.pinchDist-nd)*0.4));
        pState.pinchDist = nd;
        return;
      }
      var xy = getXY(e);
      var dx = xy.x-pState.x, dy = xy.y-pState.y;
      if (Math.abs(xy.x-pState.downX)+Math.abs(xy.y-pState.downY)>5) pState.moved=true;
      camState.targetY += dx*0.005;
      camState.targetX += dy*0.005;
      camState.targetX = Math.max(-Math.PI/2+0.05, Math.min(Math.PI/2-0.05, camState.targetX));
      pState.x=xy.x; pState.y=xy.y;
    }
    function onUp(e) {
      if (pState.dragging && !pState.moved) {
        var src = e.changedTouches ? e.changedTouches[0] : e;
        var hits = doRaycast(src.clientX, src.clientY);
        if (hits.length) {
          var obj = hits[0].object;
          var pl = obj.userData.player;
          setSelected(pl);
          selRing.position.copy(obj.position);
          selRing.scale.setScalar(obj.userData.radius * 3.2);
          selRing.visible = true;
        } else {
          setSelected(null);
          selRing.visible = false;
        }
      }
      pState.dragging=false; pState.pinchDist=0;
    }
    function onWheel(e) {
      e.preventDefault();
      camState.dist = Math.max(20, Math.min(250, camState.dist + e.deltaY*0.07));
    }
    var dom = renderer.domElement;
    dom.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    dom.addEventListener('wheel', onWheel, {passive:false});
    dom.addEventListener('touchstart', onDown, {passive:true});
    dom.addEventListener('touchmove', onMove, {passive:true});
    dom.addEventListener('touchend', onUp);

    function onResize() {
      var nw=mount.clientWidth, nh=mount.clientHeight;
      camera.aspect=nw/nh; camera.updateProjectionMatrix();
      renderer.setSize(nw,nh);
    }
    window.addEventListener('resize', onResize);

    var frameId, lastTime=0;
    function animate(t) {
      frameId = requestAnimationFrame(animate);
      var dt = Math.min((t - lastTime)/1000, 0.05); lastTime = t;
      // Smooth camera interpolation
      var lerpSpeed = 8 * dt;
      camState.rotX += (camState.targetX - camState.rotX) * lerpSpeed;
      camState.rotY += (camState.targetY - camState.rotY) * lerpSpeed;
      if (!pState.dragging) { camState.targetY += 0.0005; }
      var yaw = camState.rotY;
      camera.position.x = camState.dist * Math.cos(camState.rotX) * Math.sin(yaw);
      camera.position.y = camState.dist * Math.sin(camState.rotX);
      camera.position.z = camState.dist * Math.cos(camState.rotX) * Math.cos(yaw);
      camera.lookAt(0,0,0);
      if (selRing.visible) selRing.lookAt(camera.position);
      if (hoverRing.visible) hoverRing.lookAt(camera.position);
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    return function() {
      cancelAnimationFrame(frameId);
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('resize', onResize);
      playerMeshes.forEach(function(m){ m.geometry.dispose(); m.material.dispose(); });
      glowGroup.children.forEach(function(m){ m.geometry.dispose(); m.material.dispose(); });
      starsGeo.dispose(); starMat.dispose();
      ringGeo.dispose(); ringMat.dispose();
      hoverRingGeo.dispose(); hoverRingMat.dispose();
      renderer.dispose();
      if (mount.contains(renderer.domElement)) mount.removeChild(renderer.domElement);
    };
  }, [universe, positions3d]);

  // Similarity neighbors
  var neighbors = useMemo(function() {
    if (!selected || !universe.length) return [];
    var features = universe.map(function(p){ return buildFeatures(p, data.isSuperflex); });
    var selIdx = universe.findIndex(function(p){ return p.id === selected.id; });
    if (selIdx < 0) return [];
    var selF = features[selIdx];
    return features
      .map(function(f,i){ return { idx:i, dist: Math.sqrt(f.reduce(function(s,x,j){ return s+(x-selF[j])**2; },0)) }; })
      .filter(function(d){ return d.idx !== selIdx; })
      .sort(function(a,b){ return a.dist-b.dist; })
      .slice(0, 8)
      .map(function(d){ return universe[d.idx]; });
  }, [selected, universe, data.isSuperflex]);

  var searchResults = query.length >= 2
    ? universe.filter(function(p){ return p.n && p.n.toLowerCase().includes(query.toLowerCase()); }).slice(0, 8)
    : [];

  var filtered = posFilter === 'ALL' ? universe : universe.filter(function(p){ return p.pos === posFilter; });
  var posCounts = {};
  ['QB','RB','WR','TE'].forEach(function(pos){ posCounts[pos] = universe.filter(function(p){ return p.pos===pos; }).length; });

  return (
    <div>
      <SectionTitle sub={"3D dynasty similarity galaxy Ã¢ÂÂ " + universe.length + " players plotted. Position clusters emerge from PCA on age, value, rank & experience. Drag to orbit, scroll to zoom, click any star."}>
        Player Galaxy
      </SectionTitle>

      {/* Controls bar */}
      <div style={{display:'flex', gap:8, marginBottom:12, flexWrap:'wrap', alignItems:'center'}}>
        <div style={{position:'relative', flex:1, minWidth:200}}>
          <input
            value={query}
            onChange={function(e){ setQuery(e.target.value); }}
            placeholder="Search & highlight player..."
            style={{width:'100%', padding:'10px 12px', background:'#131820', border:'1px solid #2a3441', color:'#e8ecf0', borderRadius:4, fontSize:13, fontFamily:'inherit'}}
          />
          {searchResults.length > 0 && (
            <div style={{position:'absolute', top:'100%', left:0, right:0, marginTop:4, background:'#131820', border:'1px solid #2a3441', borderRadius:4, zIndex:20, maxHeight:240, overflowY:'auto'}}>
              {searchResults.map(function(p) {
                return (
                  <div key={p.id} onClick={function(){ setSelected(p); setQuery(''); }}
                    style={{padding:'8px 12px', cursor:'pointer', display:'flex', justifyContent:'space-between', alignItems:'center', borderBottom:'1px solid #1c2530'}}>
                    <div style={{display:'flex', alignItems:'center', gap:8}}>
                      <PosBadge pos={p.pos} />
                      <span style={{fontSize:13}}>{p.n}</span>
                    </div>
                    <span className="mono" style={{fontSize:10, color: p.isFA ? '#8b95a3' : '#d4a857'}}>{p.isFA ? 'FA' : p.owner}</span>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {/* Position filters */}
        <div style={{display:'flex', gap:4}}>
          {['ALL','QB','RB','WR','TE'].map(function(pos) {
            var active = posFilter === pos;
            var col = POS_COLOR_CSS[pos] || '#d4a857';
            return (
              <button key={pos} onClick={function(){ setPosFilter(pos); }}
                style={{padding:'8px 12px', background: active ? col : '#131820', border:'1px solid', borderColor: active ? col : '#2a3441',
                  color: active ? '#fff' : '#8b95a3', borderRadius:4, fontSize:11, fontWeight:700, fontFamily:'inherit'}}>
                {pos}{pos !== 'ALL' ? ' '+posCounts[pos] : ''}
              </button>
            );
          })}
        </div>

        {/* FA count slider */}
        <div style={{display:'flex', alignItems:'center', gap:8, fontSize:12, color:'#8b95a3'}}>
          <span className="mono" style={{fontSize:10, whiteSpace:'nowrap'}}>FA: {faCount}</span>
          <input type="range" min="50" max="500" step="50" value={faCount}
            onChange={function(e){ setFaCount(parseInt(e.target.value)); }}
            style={{width:80, accentColor:'#d4a857'}} />
        </div>

          Principal Component Analysis (PCA) compresses that into 3 axes of maximum variance Ã¢ÂÂ the three dimensions you navigate.

          The <strong style={{color:'#d4a857'}}>8 closest comps</strong> for any selected player are the nearest neighbors in the original 10D space Ã¢ÂÂ useful for finding trade equivalents.

function LeagueHistory({ data, derived }) {
  const [hd,setHd]=React.useState(null);const [ld,setLd]=React.useState(true);
  React.useEffect(()=>{(async()=>{try{setLd(true);const s=[];let lid=LEAGUE_ID;
    for(let i=0;i<6;i++){const lg=await api('/league/'+lid).catch(()=>null);if(!lg)break;
      const ws=await api('/league/'+lid+'/winners_bracket').catch(()=>[]);
      const ro=await api('/league/'+lid+'/rosters').catch(()=>[]);
      const us=await api('/league/'+lid+'/users').catch(()=>[]);
      const um=Object.fromEntries((us||[]).map(u=>[u.user_id,u.display_name]));
      const rm=Object.fromEntries((ro||[]).map(r=>[r.roster_id,um[r.owner_id]||r.owner_id]));
      const cg=(ws||[]).find(g=>g.r===3&&g.p===1);
      s.push({season:lg.season,name:lg.name,champ:cg?(rm[cg.w]||'Unknown'):null,teams:(us||[]).length});
      if(!lg.previous_league_id||lg.previous_league_id==='0')break;
      lid=lg.previous_league_id;}
    setHd(s);}catch(e){console.error(e);}finally{setLd(false);}})();},[]);
  const {standings:st}=derived;const am=data.allMatchups||{};
  const hi={sc:0,t:'',wk:0};const ts={};
  Object.entries(am).forEach(([wk,ms])=>{(ms||[]).forEach(m=>{
    const t=st.find(s=>s.roster_id===m.roster_id)?.team||'?';
    if((m.points||0)>hi.sc){hi.sc=m.points;hi.t=t;hi.wk=wk;}
    if(!ts[t])ts[t]=[];if(m.points>0)ts[t].push(m.points);
  });});
  const av=Object.entries(ts).map(([t,sc])=>({t,avg:sc.reduce((a,b)=>a+b,0)/sc.length,g:sc.length})).sort((a,b)=>b.avg-a.avg);
  const sd=a=>{const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.map(x=>(x-m)**2).reduce((x,y)=>x+y,0)/a.length);};
  const mc=av.reduce((bst,cur)=>{const sc=ts[cur.t]||[];if(sc.length<2)return bst;const d=sd(sc);return(!bst||d<bst.d)?{t:cur.t,d}:bst;},null);

      <StatCard label="Most Consistent" value={mc?mc.t:'N/A'} sub={mc?'Â±'+mc.d.toFixed(1)+' std dev':'No data'} accent="#10b981"/>
      <StatCard label="Best Avg Score" value={av[0]?av[0].t:'N/A'} sub={av[0]?av[0].avg.toFixed(1)+' pts/game':'No data'} accent="#6366f1"/>
      <StatCard label="Season" value={data.currentSeason} sub={data.league.name} accent="#f59e0b"/>
    </div>
    <SectionTitle>Past Champions</SectionTitle>
    <div className="card" style={{marginBottom:28}}>
      {ld?<div style={{padding:32,textAlign:'center',color:'#8b95a3'}}>Loading...</div>
      :(hd&&hd.length>0)?(<table style={{width:'100%',borderCollapse:'collapse'}}>
        <thead><tr style={{background:'#1c2530'}}><Th>Season</Th><Th>Champion</Th><Th>League</Th><Th align="right">Teams</Th></tr></thead>
        <tbody>{hd.map(s=><tr key={s.season} style={{borderBottom:'1px solid #2a3441'}}>
          <Td><span className="mono" style={{color:'#d4a857'}}>{s.season}</span></Td>
          <Td><span style={{fontWeight:600}}>{s.champ||'-'}</span></Td>

          <Td align="right"><span className="mono">{s.teams}</span></Td>

        <thead><tr style={{background:'#1c2530'}}><Th>#</Th><Th>Team</Th><Th align="right">Avg Pts</Th><Th align="right">Games</Th></tr></thead>

function SeasonAnalytics({ data, derived }) {
  const {standings:st}=derived;const am=data.allMatchups||{};const cw=data.currentWeek;
  const tw={};st.forEach(s=>{tw[s.roster_id]={};});
  Object.entries(am).forEach(([wk,ms])=>{(ms||[]).forEach(m=>{if(tw[m.roster_id]!==undefined)tw[m.roster_id][wk]=m.points||0;});});
  const ts=st.map(s=>{
    const sc=Object.values(tw[s.roster_id]||{}).filter(v=>v>0);
    const avg=sc.length?sc.reduce((a,b)=>a+b,0)/sc.length:0;
    const mx=sc.length?Math.max(...sc):0,mn=sc.length?Math.min(...sc):0;
    const sd=sc.length>1?Math.sqrt(sc.map(x=>(x-avg)**2).reduce((a,b)=>a+b,0)/sc.length):0;
    let lw=0;
    Object.entries(am).forEach(([wk,wms])=>{
      const ws=(wms||[]).map(m=>m.points||0).filter(v=>v>0);if(!ws.length)return;
      const med=[...ws].sort((a,b)=>a-b)[Math.floor(ws.length/2)];
      const my=tw[s.roster_id][wk];if(my===undefined)return;
      const mm=(wms||[]).find(m=>m.roster_id===s.roster_id);
      const om=(wms||[]).find(m=>m.matchup_id===mm?.matchup_id&&m.roster_id!==s.roster_id);
      if(!mm||!om)return;
      lw+=(mm.points>om.points?1:0)-(my>med?1:0);
    });
    return {...s,avg,mx,mn,sd,lw};
  });
  const bA=[...ts].sort((a,b)=>b.avg-a.avg);const bL=[...ts].sort((a,b)=>b.lw-a.lw);
  const wp=Object.keys(am).filter(w=>Object.values(am[w]||{}).some(m=>(m.points||0)>0)).length;
  return(<div>
    <SectionTitle>Season Analytics</SectionTitle>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))',gap:12,marginBottom:28}}>
      <StatCard label="Luckiest" value={bL[0]?.team||'N/A'} sub={bL[0]?'+'+bL[0].lw.toFixed(1)+' lucky wins':''} accent="#f59e0b"/>
      <StatCard label="Unluckiest" value={bL[bL.length-1]?.team||'N/A'} sub={bL[bL.length-1]?bL[bL.length-1].lw.toFixed(1)+' wins':''} accent="#dc2626"/>
      <StatCard label="Best Avg" value={bA[0]?.team||'N/A'} sub={bA[0]?bA[0].avg.toFixed(1)+' pts/wk':''} accent="#10b981"/>
      <StatCard label="Weeks Played" value={wp} sub={'of '+data.regSeasonWeeks} accent="#6366f1"/>
    </div>
    <SectionTitle>Consistency &amp; Luck</SectionTitle>
    <div className="card" style={{overflow:'hidden',marginBottom:28}}>
      <table style={{width:'100%',borderCollapse:'collapse'}}>
        <thead><tr style={{background:'#1c2530'}}><Th>Team</Th><Th align="right">Avg</Th><Th align="right">Max</Th><Th align="right">Min</Th><Th align="right">Std Dev</Th><Th align="right">Luck</Th></tr></thead>
        <tbody>{bA.map(t=><tr key={t.roster_id} style={{borderBottom:'1px solid #1c2530'}}>
          <Td><span style={{fontWeight:600}}>{t.team}</span></Td>
          <Td align="right"><span className="mono" style={{color:'#d4a857'}}>{t.avg>0?t.avg.toFixed(1):'-'}</span></Td>
          <Td align="right"><span className="mono" style={{color:'#10b981'}}>{t.mx>0?t.mx.toFixed(1):'-'}</span></Td>
          <Td align="right"><span className="mono" style={{color:'#dc2626'}}>{t.mn>0?t.mn.toFixed(1):'-'}</span></Td>
          <Td align="right"><span className="mono">{t.sd>0?t.sd.toFixed(1):'-'}</span></Td>
          <Td align="right"><span className="mono" style={{color:t.lw>0?'#10b981':t.lw<0?'#dc2626':'#8b95a3'}}>{t.lw>0?'+':''}{t.lw.toFixed(1)}</span></Td>
        </tr>)}{bA.length===0&&<tr><td colSpan={6} style={{padding:24,textAlign:'center',color:'#8b95a3'}}>No scoring data yet.</td></tr>}</tbody>
      </table>
    </div>
    <SectionTitle>Weekly Scores</SectionTitle>
    <div style={{overflowX:'auto'}}><div className="card" style={{overflow:'hidden'}}>
      <table style={{width:'100%',borderCollapse:'collapse',minWidth:500}}>
        <thead><tr style={{background:'#1c2530'}}><Th>Team</Th>{Array.from({length:Math.min(cw,data.regSeasonWeeks)},(_,i)=><Th key={i+1} align="right" style={{fontSize:10}}>W{i+1}</Th>)}</tr></thead>
        <tbody>{st.map(s=><tr key={s.roster_id} style={{borderBottom:'1px solid #1c2530'}}>
          <Td><span style={{fontWeight:600,fontSize:12}}>{s.team}</span></Td>
          {Array.from({length:Math.min(cw,data.regSeasonWeeks)},(_,i)=>{const sc=tw[s.roster_id][i+1];return <Td key={i+1} align="right"><span className="mono" style={{fontSize:11,color:sc>0?'#e8ecf0':'#475569'}}>{sc>0?sc.toFixed(0):'-'}</span></Td>;})}
        </tr>)}</tbody>
      </table>
    </div></div>
  </div>);
}

function HeadToHead({ data, derived }) {
  const {standings:st}=derived;const am=data.allMatchups||{};
  const [tA,setA]=React.useState(st[0]?.roster_id||null);
  const [tB,setB]=React.useState(st[1]?.roster_id||null);
  const rec=React.useMemo(()=>{
    if(!tA||!tB)return null;let aW=0,bW=0,gs=[];
    Object.entries(am).forEach(([wk,wms])=>{
      const a=(wms||[]).find(m=>m.roster_id===parseInt(tA));
      const b=(wms||[]).find(m=>m.roster_id===parseInt(tB));
      if(!a||!b||a.matchup_id!==b.matchup_id||(a.points||0)===0&&(b.points||0)===0)return;
      const aw=a.points>b.points;if(aw)aW++;else bW++;
      gs.push({wk:parseInt(wk),as:a.points,bs:b.points,aw});
    });return {aW,bW,gs};
  },[tA,tB,am]);
  const ai=st.find(s=>s.roster_id===parseInt(tA));const bi=st.find(s=>s.roster_id===parseInt(tB));
  const ss={background:'#1c2530',border:'1px solid #2a3441',color:'#e8ecf0',padding:'8px 12px',borderRadius:4,fontSize:13,flex:1};
  return(<div>
    <SectionTitle>Head-to-Head History</SectionTitle>
    <div className="card" style={{marginBottom:24}}>
      <div style={{display:'flex',gap:16,alignItems:'center',flexWrap:'wrap',marginBottom:20}}>
        <select style={ss} value={tA} onChange={e=>setA(parseInt(e.target.value))}>{st.map(s=><option key={s.roster_id} value={s.roster_id}>{s.team}</option>)}</select>
        <span style={{color:'#d4a857',fontWeight:700,fontSize:18}}>VS</span>
        <select style={ss} value={tB} onChange={e=>setB(parseInt(e.target.value))}>{st.filter(s=>s.roster_id!==parseInt(tA)).map(s=><option key={s.roster_id} value={s.roster_id}>{s.team}</option>)}</select>
      </div>
      {rec&&(<><div style={{display:'grid',gridTemplateColumns:'1fr auto 1fr',gap:20,alignItems:'center',marginBottom:24,padding:'20px 0',borderTop:'1px solid #2a3441',borderBottom:'1px solid #2a3441'}}>
        <div style={{textAlign:'center'}}><div style={{fontSize:13,color:'#8b95a3',marginBottom:8}}>{ai?.team}</div><div style={{fontSize:48,fontFamily:'Anton,sans-serif',color:rec.aW>rec.bW?'#10b981':'#e8ecf0'}}>{rec.aW}</div><div style={{fontSize:11,color:'#8b95a3'}}>wins</div></div>
        <div style={{textAlign:'center',color:'#475569',fontSize:12}}>{rec.gs.length} meetings</div>

function ContentionWindow({ data, derived }) {
  const {standings:st,powerRankings:pr,playoffOdds:po}=derived;
  const ra=st.map(s=>{
    const sa=(s.starters||[]).map(pid=>{const p=data.players[pid];return p?.age||null;}).filter(Boolean);
    const aa=sa.length?sa.reduce((a,b)=>a+b,0)/sa.length:null;
    const tv=pr.find(p=>p.roster_id===s.roster_id)?.totalValue||0;
    const od=po[s.roster_id]?.playoff||0;
    let lb,cl;
    if(aa===null){lb='Unknown';cl='#475569';}
    else if(aa<25&&tv>45000){lb='Dynasty Core';cl='#6366f1';}
    else if(aa<26){lb='Rebuilding';cl='#f59e0b';}
    else if(aa<28&&tv>40000){lb='Rising';cl='#10b981';}
    else if(aa>=28&&od>50){lb='Win Now';cl='#dc2626';}
    else if(aa>=28){lb='Aging';cl='#ef4444';}
    else{lb='Contending';cl='#10b981';}
    return {...s,aa,tv,od,lb,cl};
  }).sort((a,b)=>(b.aa||0)-(a.aa||0));
  const pc={'Win Now':'#dc2626','Contending':'#10b981','Rising':'#10b981','Dynasty Core':'#6366f1','Rebuilding':'#f59e0b','Aging':'#ef4444'};
  return(<div>
    <SectionTitle>Contention Window</SectionTitle>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:12,marginBottom:28}}>
      {['Win Now','Contending','Rising','Dynasty Core','Rebuilding','Aging'].map(ph=>{
        const cnt=ra.filter(t=>t.lb===ph).length;
        return<div key={ph} className="card" style={{padding:16,borderLeft:'3px solid '+(pc[ph]||'#8b95a3')}}>
          <div style={{fontSize:11,fontWeight:700,color:pc[ph]||'#8b95a3',textTransform:'uppercase',letterSpacing:0.5}}>{ph}</div>
          <div style={{fontSize:32,fontFamily:'Anton,sans-serif',color:'#e8ecf0',marginTop:4}}>{cnt}</div>
          <div style={{fontSize:11,color:'#8b95a3'}}>team{cnt!==1?'s':''}</div>
        </div>;
      })}
    </div>
    <SectionTitle>Team Breakdown</SectionTitle>
    <div className="card" style={{overflow:'hidden',marginBottom:16}}>
      <table style={{width:'100%',borderCollapse:'collapse'}}>
        <thead><tr style={{background:'#1c2530'}}><Th>Team</Th><Th align="center">Phase</Th><Th align="right">Avg Starter Age</Th><Th align="right">Value</Th><Th align="right">Playoff %</Th></tr></thead>
        <tbody>{ra.map(t=><tr key={t.roster_id} style={{borderBottom:'1px solid #1c2530'}}>
          <Td><span style={{fontWeight:600}}>{t.team}</span></Td>
          <Td align="center"><span style={{fontSize:11,padding:'3px 10px',borderRadius:4,background:t.cl+'20',color:t.cl,fontWeight:600}}>{t.lb}</span></Td>
          <Td align="right"><span className="mono">{t.aa?t.aa.toFixed(1):'-'}</span></Td>
          <Td align="right"><span className="mono" style={{color:'#d4a857'}}>{t.tv.toLocaleString()}</span></Td>
          <Td align="right"><span className="mono" style={{color:t.od>60?'#10b981':t.od>30?'#d4a857':'#8b95a3'}}>{t.od.toFixed(1)}%</span></Td>
        </tr>)}</tbody>
      </table>
    </div>
    <div style={{padding:'12px 16px',background:'#1c2530',borderRadius:6,fontSize:12,color:'#8b95a3'}}>
      <strong style={{color:'#d4a857'}}>Guide:</strong> Win Now = 28+ age + strong playoff odds Â· Contending = competitive Â· Rising = young + value Â· Dynasty Core = very young high value Â· Rebuilding = building Â· Aging = older roster
    </div>
  </div>);
}

function NewsAndMoves({ data, derived }) {

    const all=[];const wc=Math.min(data.currentWeek,data.regSeasonWeeks);
    for(let w=Math.max(1,wc-4);w<=wc;w++){const t=await api('/league/'+LEAGUE_ID+'/transactions/'+w).catch(()=>[]);(t||[]).forEach(x=>all.push({...x,week:w}));}
    all.sort((a,b)=>(b.status_updated||0)-(a.status_updated||0));setTxns(all);
  }catch(e){console.error(e);}finally{setLd(false);}})();},[]);

  const tc={trade:'#d4a857',free_agent:'#10b981',waiver:'#6366f1',commissioner:'#f59e0b'};

        <button key={type} onClick={()=>setFilt(type)} style={{background:filt===type?'#d4a857':'#1c2530',border:'1px solid '+(filt===type?'#d4a857':'#2a3441'),color:filt===type?'#0a0d12':'#e8ecf0',padding:'6px 14px',borderRadius:4,fontSize:12,fontWeight:600,cursor:'pointer'}}>

    :ft.length===0?<div className="card" style={{padding:32,textAlign:'center',color:'#8b95a3'}}>No transactions found.</div>
    :(<div style={{display:'flex',flexDirection:'column',gap:8}}>
      {ft.slice(0,50).map((txn,i)=>{
        const dt=txn.status_updated?new Date(txn.status_updated).toLocaleDateString():'';
        const adds=Object.keys(txn.adds||{});const drops=Object.keys(txn.drops||{});
        return(<div key={txn.transaction_id||i} className="card" style={{padding:'14px 16px',borderLeft:'3px solid '+(tc[txn.type]||'#475569'),opacity:txn.status==='complete'?1:0.6}}>

            <span className="mono" style={{fontSize:10,color:'#475569'}}>Wk {txn.week} Â· {dt}</span>
          </div>
          {txn.type==='trade'?(
            <div style={{fontSize:12,color:'#8b95a3'}}>{(txn.roster_ids||[]).map(rid=><span key={rid} style={{marginRight:6,color:'#e8ecf0',fontWeight:600}}>{gt(rid)}</span>)}<span> traded </span>{Object.entries(txn.adds||{}).slice(0,4).map(([pid])=><span key={pid} style={{marginLeft:4,color:'#d4a857'}}>{gp(pid)}</span>)}</div>
          ):(<div style={{fontSize:12}}>

            {drops.length>0&&<div><span style={{color:'#dc2626'}}>- {drops.slice(0,3).map(gp).join(', ')}</span>{drops.length>3&&<span style={{color:'#8b95a3'}}> +{drops.length-3} more</span>}</div>}
          </div>)}

function Commissioner({ data, derived }) {
  const {standings:st,powerRankings:pr,playoffOdds:po}=derived;
  const [note,setNote]=React.useState(()=>localStorage.getItem('commish_note')||'');
  const [sv,setSv]=React.useState(false);
  const save=()=>{localStorage.setItem('commish_note',note);setSv(true);setTimeout(()=>setSv(false),2000);};
  const am=data.allMatchups||{};
  const avg=st.reduce((s,t)=>s+t.pf,0)/st.length;
  let cg=0;Object.values(am).forEach(wm=>{const sc=(wm||[]).filter(m=>m.points>0);const seen={};sc.forEach(m=>{const o=sc.find(x=>x.matchup_id===m.matchup_id&&x.roster_id!==m.roster_id);const k=[m.roster_id,o?.roster_id].sort().join('-');if(o&&!seen[k]){seen[k]=true;if(Math.abs(m.points-o.points)<10)cg++;}});});
  let bm=null;Object.entries(am).forEach(([wk,wm])=>{const sc=(wm||[]).filter(m=>m.points>0);const seen={};sc.forEach(m=>{const o=sc.find(x=>x.matchup_id===m.matchup_id&&x.roster_id!==m.roster_id);const k=[m.roster_id,o?.roster_id].sort().join('-');if(o&&!seen[k]){seen[k]=true;const d=Math.abs(m.points-o.points);if(!bm||d<bm.d)bm={wk,d,tA:st.find(s=>s.roster_id===m.roster_id)?.team,tB:st.find(s=>s.roster_id===o.roster_id)?.team};}});});
  const is={background:'#1c2530',border:'1px solid #2a3441',color:'#e8ecf0',padding:'10px 12px',borderRadius:4,fontSize:13,width:'100%',fontFamily:'DM Sans,sans-serif',resize:'vertical'};

    </div>
    <SectionTitle>League Notes</SectionTitle>
    <div className="card" style={{marginBottom:24}}>
      <div style={{fontSize:12,color:'#8b95a3',marginBottom:10}}>Saved in your browser. Use for announcements, house rules, trade notes.</div>

      <div style={{display:'flex',justifyContent:'flex-end',marginTop:10}}>
        <button onClick={save} style={{background:sv?'#10b981':'#d4a857',color:'#0a0d12',border:'none',padding:'8px 20px',borderRadius:4,fontWeight:700,fontSize:13,cursor:'pointer'}}>{sv?'â Saved':'Save'}</button>
      </div>

    <div className="card" style={{overflow:'hidden'}}>
      <table style={{width:'100%',borderCollapse:'collapse'}}>
